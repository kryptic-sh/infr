name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Opt JS-based actions into Node 24 ahead of the GH default flip (June 2026)
  # to surface upstream incompatibility early. Mirrors the krypt / tikr baseline.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# infr builds on Linux, macOS and Windows, and `clippy` + `test` run natively on
# all three (see `docs/ci-matrix.md`). Every runner needs `glslc` — shaderc's GLSL
# compiler — because `infr-vulkan/build.rs` compiles the compute shaders to SPIR-V
# at build time with no prebuilt fallback; `.github/actions/install-glslc` is the
# one place that knows how per platform. ash dlopens Vulkan at runtime, so no
# libvulkan is needed to BUILD, and the GPU integration tests are `#[ignore]`d
# (they need a real device) — CI runs the CPU suite.
#
# What stays single-platform, and why: `cpu-goldens` asserts exact-token hashes
# that are not reproducible across CPU microarchitectures (commit 273f8d4), so
# fanning it out would multiply a known-flaky check; `build` is a release-profile
# smoke test the matrix already covers in debug; `test-macos` runs the Metal
# parity suite, which needs a real Metal device and `--include-ignored`.

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: rustup update --no-self-update stable
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's lint failure must not hide the other two's.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Intra-doc links are not checked by `cargo build` or `clippy`, so they rot
  # silently: this job was added after a single pass fixed 140 broken links across
  # nine crates. Linux-only because a doc link resolves the same everywhere.
  #
  # `--keep-going` is load-bearing. Without it cargo stops at the FIRST crate that
  # fails, which is how the backlog entry that prompted the cleanup came to record
  # "23 links across 4 crates" when the real figure was 140 across 9 — a partial
  # run reported as a total.
  docs:
    name: cargo doc (intra-doc links)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked --keep-going
        env:
          RUSTDOCFLAGS:
            "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked

  # CPU generation goldens against REAL models. The `cpu_golden_*` /
  # `cpu_kv_*` tests in `infr-llama/tests/cpu_backend.rs` self-skip when the
  # GGUF isn't in the HF cache (see the `need_model!` macro), so on a bare
  # runner they always no-op — which is exactly how a real arch-correctness bug
  # (the Q8_0 sub-256 truncation that changed gemma-3-1b's output) slipped past
  # CI. This job downloads a SMALL representative set of goldens into the
  # standard HuggingFace hub cache (`~/.cache/huggingface/hub/models--<org>--
  # <repo>/snapshots/<commit>/<file>` — the exact layout `find_gguf` reads),
  # caches them across runs, and runs the CPU suite so those goldens actually
  # execute and their hashes are asserted. Runs in parallel with the other jobs.
  #
  # Model set (Q4_K_M, ~1.7 GB total) — one per distinct architecture family
  # with a CPU golden, deliberately excluding the multi-GB MoE / big models:
  #   unsloth/gemma-3-1b-it-GGUF  (769 MB) — dense SWA/GeGLU, hd=256; the
  #                                          non-256-in_f arch that caught Q8_0
  #   unsloth/Qwen3-0.6B-GGUF     (379 MB) — dense; also drives the cpu_kv_*
  #                                          coherence + quant-sweep tests
  # Qwen3.5-0.8B (gated-DeltaNet) is intentionally NOT downloaded: its longer
  # greedy generation is FP-sensitive, so the exact-token golden hash is not
  # portable across CPU microarchitectures (coherent but different tokens on the
  # runner vs the dev box). gemma3/qwen3 are short + stable enough to reproduce
  # bit-for-bit; with the model absent, cpu_golden_qwen35 self-skips (need_model!).
  cpu-goldens:
    name: cargo test (CPU goldens, real models)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      # Cache the downloaded GGUFs across runs. The key encodes the exact model
      # set + quant, so it only re-downloads when that list changes (bump the
      # `-v1` suffix if you change the models below).
      - name: Cache golden model GGUFs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cpu-goldens-gemma3-1b_qwen3-06b-q4km-v2
      - name: Download golden GGUFs (single file per repo)
        run: |
          pipx install huggingface_hub
          hf download unsloth/gemma-3-1b-it-GGUF gemma-3-1b-it-Q4_K_M.gguf
          hf download unsloth/Qwen3-0.6B-GGUF   Qwen3-0.6B-Q4_K_M.gguf
      # Release build: these run real CPU inference (the f32 reference backend),
      # which is far too slow to time out in debug. Single-threaded because the
      # goldens mutate process-global generation env under a shared lock.
      - run: cargo test --release -p infr-llama --test cpu_backend --locked -- --test-threads=1

  build:
    name: cargo build --release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --locked

  # Cheap Linux guard for the Apple target: cross-compiling to
  # aarch64-apple-darwin doesn't link, so no macOS SDK is needed — it just
  # typechecks and lints what the Linux jobs compile for a different arch, plus
  # `infr-metal`, which they never build at all (it is `#![cfg(target_os =
  # "macos")]`). Catches arch-conditional dead code and Op-signature drift in
  # under a minute, before the `macos-15` runners spend three.
  #
  # The crate list is every crate that cross-builds. The rest cannot: `ring`
  # (via rustls → reqwest → infr-hub) and `esaxx-rs` (via tokenizers →
  # infr-chat/infr-llama) are C/C++ and need an Apple toolchain, which takes
  # infr-hub, infr-chat, infr-llama, infr-engine, infr-server and infr-cli with
  # them. Those are covered natively by the `macos-15` matrix leg.
  metal-check:
    name: cargo clippy (Apple target)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy -p infr-plat -p infr-prof -p infr-prof-rt -p infr-core -p
          infr-gguf -p infr-cpu -p infr-vulkan -p infr-metal -p infr-testkit
          --all-targets --locked --target aarch64-apple-darwin -- -D warnings

  # macOS / Metal: the Linux jobs above never build `infr-metal` (it is
  # `#![cfg(target_os = "macos")]`). This job builds the workspace on an
  # Apple-Silicon runner — which has a real Metal device — and runs the
  # infr-metal parity suite. Those tests are `#[ignore]`d like the Vulkan GPU
  # tests, so they need an explicit `--include-ignored`.
  #
  # `--nocapture` is load-bearing, not debug noise: `tests/pcache.rs` prints the
  # cold-vs-warm pipeline-cache breakdown (MSL front end, which is NOT cached,
  # versus PSO creation, which is), and this log is the ONLY place that
  # measurement exists — no one on this project has a Metal device.
  test-macos:
    name: cargo test (macOS / Metal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test -p infr-metal --locked -- --include-ignored --nocapture
