# Device facts the tuning snapshot test resolves against (`tuning::tests`). Each fixture's
# resolved set is checked in under `snapshots/<id>.txt`.
#
# `measured = true` fixtures were dumped from a real device with `infr tune show --dev VulkanN
# --json` (its `device` object) and cross-checked against `vulkaninfoSDK --summary`. The others
# are BUILT from what the code's vendor rules and docs/backlog.md record about that hardware —
# nobody here has run them — and say where each number came from.
#
# `matrix_units` and `dot_accelerated` were added on 2026-11-18 from what each source records:
# the RX 7900 XTX and RTX 2080 Ti run the 16x16x16 f16 coopmat tier; the RDNA2 iGPU and the A770
# do not (the A770's XMX tile is 8x8, a separate tier); the RX 580 owner's probe line and
# llama.cpp's `int dot: 0` on that card (issue 94) say its int8 dot is emulated.

