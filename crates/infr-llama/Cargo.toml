[package]
name = "infr-llama"
description = "Transformer model runner for infr over its CPU, Vulkan and Metal backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compiles `infr_llama::mutation`: bugs a test plants in one loaded model's graph
# (`SeamModel::plant`), so the GPU tolerance gate can be shown to fail on them
# (`docs/gpu-tolerance.md`, "Mutations"). Off by default: a normal build has no trace of them.
# Run the demonstrations with `--features mutations` (the doc gives the command).
mutations = []

[dependencies]
infr-prof.workspace = true
infr-prof-rt.workspace = true
infr-core.workspace = true
infr-chat.workspace = true
infr-vulkan.workspace = true
infr-gguf.workspace = true
infr-cpu.workspace = true
serde_json.workspace = true
llguidance.workspace = true
toktrie_hf_tokenizers.workspace = true
half.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
rayon.workspace = true
tracing.workspace = true
tokenizers = { workspace = true }

[dev-dependencies]
infr-hub.workspace = true
infr-testkit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
infr-metal.workspace = true
