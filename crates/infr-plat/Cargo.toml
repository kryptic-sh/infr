[package]
name = "infr-plat"
description = "Platform seam for infr: every OS-specific capability behind one interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Config/cache/data directory resolution. `dirs::home_dir()` goes through the
# `FOLDERID_Profile` Known Folder on Windows, which is the whole reason the
# hand-rolled `$HOME` lookups this crate replaces could not find anything there.
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
# `flock`, `kill(pid, 0)`, `sigaction`, the async-signal-safe `write`/`_exit`
# pair, and `localtime_r`/`strftime`. Target-gated because this crate is the one
# place they are reached from.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The C runtime's `tm` and `localtime_s` for `localtime`: the `windows` crate
# binds Win32, not the CRT.
libc.workspace = true
windows = { version = "0.58", features = [
    "Win32_Foundation",               # HANDLE, BOOL
    "Win32_System_Console",           # SetConsoleCtrlHandler, ReadConsoleW
    "Win32_Storage_FileSystem",       # LockFileEx / UnlockFileEx
    "Win32_System_IO",                # OVERLAPPED
    "Win32_System_Ioctl",             # FSCTL_SET_SPARSE
    "Win32_System_SystemInformation", # GlobalMemoryStatusEx
    "Win32_System_ProcessStatus",     # GetProcessMemoryInfo, QueryWorkingSetEx
    "Win32_System_Memory",            # VirtualUnlock (releases mapped pages from the working set)
    "Win32_Security",                 # CreateJobObjectW in native tests
    "Win32_System_JobObjects",        # QueryInformationJobObject
    "Win32_System_Threading",         # JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds IO_COUNTERS
    "Win32_System_Kernel",            # PROCESSOR_NUMBER (the placement test reads where it runs)
] }

[dev-dependencies]
memmap2.workspace = true
tempfile = "3"
