name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Opt JS-based actions into Node 24 ahead of the GH default flip (June 2026)
  # to surface upstream incompatibility early. Mirrors the krypt / tikr baseline.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# infr builds on Linux, macOS and Windows, and `clippy` + `test` run natively on
# all three (see `docs/ci-matrix.md`). Every runner needs `glslc` — shaderc's GLSL
# compiler — because `infr-vulkan/build.rs` compiles the compute shaders to SPIR-V
# at build time with no prebuilt fallback; `.github/actions/install-glslc` is the
# one place that knows how per platform. ash dlopens Vulkan at runtime, so no
# libvulkan is needed to BUILD, and the GPU integration tests are `#[ignore]`d
# (they need a real device) — CI runs the CPU suite.
#
# What stays single-platform, and why: `cpu-goldens` asserts exact-token hashes
# that are not reproducible across CPU microarchitectures (commit 273f8d4), so
# fanning it out would multiply a known-flaky check; `build` is a release-profile
# smoke test the matrix already covers in debug; `test-macos` runs the Metal
# parity suite, which needs a real Metal device and `--include-ignored`;
# `windows-smoke` is a Windows-only gap-filler, since Linux and macOS already
# download and run models in other jobs.

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: rustup update --no-self-update stable
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's lint failure must not hide the other two's.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Intra-doc links are not checked by `cargo build` or `clippy`, so they rot
  # silently: this job was added after a single pass fixed 140 broken links across
  # nine crates. Linux-only because a doc link resolves the same everywhere.
  #
  # `--keep-going` is load-bearing. Without it cargo stops at the FIRST crate that
  # fails, which is how the backlog entry that prompted the cleanup came to record
  # "23 links across 4 crates" when the real figure was 140 across 9 — a partial
  # run reported as a total.
  docs:
    name: cargo doc (intra-doc links)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked --keep-going
        env:
          RUSTDOCFLAGS:
            "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked

  # CPU generation goldens against REAL models. The `cpu_golden_*` /
  # `cpu_kv_*` tests in `infr-llama/tests/cpu_backend.rs` self-skip when the
  # GGUF isn't in the HF cache (see the `need_model!` macro), so on a bare
  # runner they always no-op — which is exactly how a real arch-correctness bug
  # (the Q8_0 sub-256 truncation that changed gemma-3-1b's output) slipped past
  # CI. This job downloads a SMALL representative set of goldens into the
  # standard HuggingFace hub cache (`~/.cache/huggingface/hub/models--<org>--
  # <repo>/snapshots/<commit>/<file>` — the exact layout `find_gguf` reads),
  # caches them across runs, and runs the CPU suite so those goldens actually
  # execute and their hashes are asserted. Runs in parallel with the other jobs.
  #
  # Model set (Q4_K_M, ~1.7 GB total) — one per distinct architecture family
  # with a CPU golden, deliberately excluding the multi-GB MoE / big models:
  #   unsloth/gemma-3-1b-it-GGUF  (769 MB) — dense SWA/GeGLU, hd=256; the
  #                                          non-256-in_f arch that caught Q8_0
  #   unsloth/Qwen3-0.6B-GGUF     (379 MB) — dense; also drives the cpu_kv_*
  #                                          coherence + quant-sweep tests
  # Qwen3.5-0.8B (gated-DeltaNet) is intentionally NOT downloaded: its longer
  # greedy generation is FP-sensitive, so the exact-token golden hash is not
  # portable across CPU microarchitectures (coherent but different tokens on the
  # runner vs the dev box). gemma3/qwen3 are short + stable enough to reproduce
  # bit-for-bit; with the model absent, cpu_golden_qwen35 self-skips (need_model!).
  cpu-goldens:
    name: cargo test (CPU goldens, real models)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      # Cache the downloaded GGUFs across runs. The key encodes the exact model
      # set + quant, so it only re-downloads when that list changes (bump the
      # `-v1` suffix if you change the models below).
      - name: Cache golden model GGUFs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cpu-goldens-gemma3-1b_qwen3-06b-q4km-v2
      - name: Download golden GGUFs (single file per repo)
        run: |
          pipx install huggingface_hub
          hf download unsloth/gemma-3-1b-it-GGUF gemma-3-1b-it-Q4_K_M.gguf
          hf download unsloth/Qwen3-0.6B-GGUF   Qwen3-0.6B-Q4_K_M.gguf
      # Release build: these run real CPU inference (the f32 reference backend),
      # which is far too slow to time out in debug. Single-threaded because the
      # goldens mutate process-global generation env under a shared lock.
      - run: cargo test --release -p infr-llama --test cpu_backend --locked -- --test-threads=1

  build:
    name: cargo build --release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --locked

  # Cheap Linux guard for the Apple target: cross-compiling to
  # aarch64-apple-darwin doesn't link, so no macOS SDK is needed — it just
  # typechecks and lints what the Linux jobs compile for a different arch, plus
  # `infr-metal`, which they never build at all (it is `#![cfg(target_os =
  # "macos")]`). Catches arch-conditional dead code and Op-signature drift in
  # under a minute, before the `macos-15` runners spend three.
  #
  # The crate list is every crate that cross-builds. The rest cannot: `ring`
  # (via rustls → reqwest → infr-hub) and `esaxx-rs` (via tokenizers →
  # infr-chat/infr-llama) are C/C++ and need an Apple toolchain, which takes
  # infr-hub, infr-chat, infr-llama, infr-engine, infr-server and infr-cli with
  # them. Those are covered natively by the `macos-15` matrix leg.
  metal-check:
    name: cargo clippy (Apple target)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy -p infr-plat -p infr-prof -p infr-prof-rt -p infr-core -p
          infr-gguf -p infr-cpu -p infr-vulkan -p infr-metal -p infr-testkit
          --all-targets --locked --target aarch64-apple-darwin -- -D warnings

  # macOS / Metal: the Linux jobs above never build `infr-metal` (it is
  # `#![cfg(target_os = "macos")]`). This job builds the workspace on an
  # Apple-Silicon runner — which has a real Metal device — and runs the
  # infr-metal parity suite. Those tests are `#[ignore]`d like the Vulkan GPU
  # tests, so they need an explicit `--include-ignored`.
  #
  # `--nocapture` is load-bearing, not debug noise: `tests/pcache.rs` prints the
  # cold-vs-warm pipeline-cache breakdown (MSL front end, which is NOT cached,
  # versus PSO creation, which is), and this log is the ONLY place that
  # measurement exists — no one on this project has a Metal device.
  test-macos:
    name: cargo test (macOS / Metal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test -p infr-metal --locked -- --include-ignored --nocapture

  # Windows end to end: the matrix compiles and unit-tests on Windows, but until
  # this job nothing there had ever downloaded a model or run a generation — and
  # downloading is where Windows actually differs. It exercises, on a real
  # Windows filesystem and in one command, the whole path the unit tests can only
  # approximate: the Hugging Face cache location, the ranged/concurrent pull, the
  # blob link (a plain account has no `SeCreateSymbolicLinkPrivilege`, so this is
  # the only place `link_blob`'s HARD-LINK fallback runs), the GGUF open, and a
  # CPU forward.
  #
  # `--dev cpu` because the runner has no GPU. Greedy and 8 tokens: this is a
  # smoke test of the path, not of what the model says — the token-exact goldens
  # live in `cpu-goldens`, which is pinned to one CPU for reproducibility.
  windows-smoke:
    name: infr run (Windows, end to end)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      # Same model and quant as `cpu-goldens`, and the same cache-key rule: bump
      # the suffix when the model below changes. The path is where infr itself
      # resolves the hub on Windows — `~/.cache/huggingface`, NOT
      # `%LOCALAPPDATA%`, because `huggingface_hub` has no native-directory arm
      # and infr agrees with it (see `Store::discover`).
      - name: Cache the smoke-test GGUF
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-windows-smoke-qwen3-06b-q4km-v1
      - run: cargo build --release -p infr-cli --locked
      # The pull is deliberately NOT a separate `infr pull` step: `infr run`
      # auto-pulls, so this asserts the fetch and the load agree about where the
      # file went, which is the half a two-step version would not check.
      - name: Pull a model and generate on CPU
        shell: pwsh
        run: |
          $out = & ./target/release/infr.exe run `
            unsloth/Qwen3-0.6B-GGUF:Q4_K_M "Say hello." `
            --dev cpu --max-new 8 --temp 0 --no-think
          if ($LASTEXITCODE -ne 0) {
            throw "infr run exited $LASTEXITCODE"
          }
          # Generation goes to STDOUT (logs go to stderr), so an empty capture
          # here means the forward produced nothing however clean the exit was.
          if ([string]::IsNullOrWhiteSpace($out -join "")) {
            throw "infr run produced no output on stdout"
          }
          Write-Host "generated: $out"

  # Release packaging, after the sibling repos (hrdr, gpur, krypt). Runs on every
  # main push as a packaging dry run and on every v* tag; PRs skip it. Uploading
  # to a GitHub Release is the separate, tag-gated job below.
  #
  # Linux goes through `cargo zigbuild` against glibc 2.28 so the binary runs on
  # distros older than the runner; zig also compiles the C/C++ that `tokenizers`
  # (esaxx-rs, onig_sys) and `ring` pull in. No musl targets: ash loads
  # libvulkan with dlopen, which a static musl binary cannot do. `glslc` runs on
  # the HOST inside `infr-vulkan/build.rs`, so the x86_64 one serves the
  # aarch64 cross build too.
  dist:
    name: Package ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    # The release profile keeps line tables for profilers, which bloats the ELF
    # binaries; a shipped binary drops them and keeps symbols, so a panic
    # backtrace still names its functions.
    env:
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.28
            macos_min: ""
            archive: tar.gz
          - os: ubuntu-26.04
            target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.28
            macos_min: ""
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            zigbuild_target: ""
            macos_min: ""
            archive: zip
          - os: macos-15
            target: aarch64-apple-darwin
            zigbuild_target: ""
            macos_min: "11.0"
            archive: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            zigbuild_target: ""
            macos_min: "10.15"
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false
      - run: rustup update --no-self-update stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}
      - name: Setup zig
        if: matrix.zigbuild_target != ''
        uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2.2.2
        with:
          version: "0.15.1"
      - name: Install cargo-zigbuild
        if: matrix.zigbuild_target != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build binary (zigbuild)
        if: matrix.zigbuild_target != ''
        run:
          cargo zigbuild --release --locked --target ${{ matrix.zigbuild_target
          }} -p infr-cli --bin infr
      - name: Build binary (native)
        if: matrix.zigbuild_target == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run:
          cargo build --release --locked --target ${{ matrix.target }} -p
          infr-cli --bin infr
      # Every target the runner can execute, so a binary that links but cannot
      # start (a missing DLL, a too-new glibc symbol) fails here, not for a user.
      - name: Smoke artifact
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: ./target/${{ matrix.target }}/release/infr --version
      # Branch refs can contain `/`; tags never do.
      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          REF=${GITHUB_REF_NAME//\//-}
          ARCHIVE="infr-${REF}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/infr dist/
          cp README.md LICENSE dist/
          tar -czf "$ARCHIVE" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '/', '-'
          $archive = "infr-$ref-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/infr.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          # LF, not Out-File's CRLF: `sha256sum -c` reads the CR into the name.
          Set-Content -NoNewline -Encoding ascii -Path "$archive.sha256" -Value "$hash  $archive`n"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infr-${{ matrix.target }}
          if-no-files-found: error
          path: |
            infr-*.tar.gz
            infr-*.tar.gz.sha256
            infr-*.zip
            infr-*.zip.sha256

  # Gated on every check job, so a red check SKIPS the release rather than
  # shipping past it — read the run's job list, not its summary, after a tag.
  publish-github-release:
    name: Publish GitHub Release
    needs:
      [
        dist,
        fmt,
        clippy,
        docs,
        test,
        cpu-goldens,
        build,
        metal-check,
        test-macos,
        windows-smoke,
      ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: infr-*
          merge-multiple: true
          path: dist
      - name: Completions + man page
        run: |
          # Archive entries are prefixed ./ (tar -C dist .)
          tar -xzf dist/infr-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz ./infr
          mkdir -p pkgext/completions
          for shell in bash zsh fish powershell elvish nushell; do
            ./infr --completions "$shell" > "pkgext/completions/infr.$shell"
          done
          ./infr --man > pkgext/infr.1
          tar -C pkgext -czf dist/infr-${GITHUB_REF_NAME}-completions-man.tar.gz .
      - name: Aggregate checksums
        working-directory: dist
        run: sha256sum $(ls infr-* | grep -v '\.sha256$') > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [publish-github-release]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # `cargo publish` builds each crate to verify it; infr-vulkan's build.rs needs glslc.
      - uses: ./.github/actions/install-glslc
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Publish workspace crates (topo order, idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # hjkl-style publish helper: idempotency probe (crates.io 403s
          # UA-less requests, so it must send a User-Agent), 429 retries
          # parsing the "try again after" timestamp (11-min fallback), and
          # pacing between crates to stay under the publish rate limits.
          publish_if_missing() {
            local crate="$1"
            local url="https://crates.io/api/v1/crates/${crate}/${VERSION}"
            if curl -fsS -A "${crate}-release-ci" -o /dev/null "$url"; then
              echo "::notice::${crate}@${VERSION} already on crates.io, skipping"
              return 0
            fi
            local attempt=0
            while [ $attempt -lt 6 ]; do
              if cargo publish -p "${crate}" --locked 2>&1 | tee /tmp/publish_"${crate}".log; then
                # Pacing across the workspace (cargo itself waits for index
                # propagation before returning).
                sleep 25
                return 0
              fi
              if grep -qiE "429|Too Many Requests" /tmp/publish_"${crate}".log; then
                local wait_until wait_secs target
                # Match the RFC 1123 stamp exactly. The old pattern was
                # `try again after [^.]+`, which runs past the timestamp and
                # stops at the first period — inside `crates.io` — yielding
                # "… 10:18:27 GMT and see https://crates". `date -d` then fails,
                # the substitution is empty, the arithmetic goes hugely negative
                # and the floor below turns every wait into a flat 30s. hrdr's v0.8.1
                # retried 11s BEFORE the limit lifted, three times, and gave up
                # with eight of nine crates published.
                wait_until=$(grep -oE 'try again after [A-Za-z]{3}, [0-9]{1,2} [A-Za-z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT' \
                  /tmp/publish_"${crate}".log | head -1 | sed 's/try again after //' || true)
                if [ -n "$wait_until" ] && target=$(date -d "$wait_until" +%s 2>/dev/null); then
                  wait_secs=$(( target - $(date +%s) + 15 ))
                  # Only a floor for a stamp already in the past, never a cap:
                  # sleeping less than the server asked for burns an attempt and
                  # pushes the next slot further out.
                  [ "$wait_secs" -lt 15 ] && wait_secs=15
                  echo "::warning::rate limited publishing ${crate}, sleeping ${wait_secs}s until $wait_until"
                else
                  wait_secs=660
                  echo "::warning::rate limited publishing ${crate}, sleeping ${wait_secs}s (11 min fallback; no parsable stamp)"
                fi
                sleep "$wait_secs"
                attempt=$(( attempt + 1 ))
              else
                echo "::error::publish failed for ${crate} (non-rate-limit error)"
                return 1
              fi
            done
            # Every attempt honours the server's own timestamp: a whole release
            # publishes every crate in `ORDER`, and crates.io refills the "updates to existing
            # crates" bucket about once a minute, so a release cut minutes after
            # another one needs real patience here.
            echo "::error::publish failed for ${crate} after 6 rate-limit retries"
            return 1
          }
          # Dependency order: each crate after every infr crate it needs, and
          # the `infr-cli` binary (the `infr` name on crates.io is someone
          # else's) last because it depends on most of them.
          ORDER="infr-plat infr-prof infr-prof-rt infr-core infr-gguf infr-hub infr-chat infr-cpu infr-vulkan infr-metal infr-engine infr-server infr-llama infr-cli"
          # A crate missing from ORDER fails the release *before* anything is
          # uploaded, rather than half-publishing and stranding the binary: a new
          # library that ships without being added here cannot be published, and
          # neither can `infr-cli` once the libs ahead of it are already up — leaving
          # a tagged release with no binary. `publish = false` members are not
          # publishable and are not listed.
          MEMBERS=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)
          LISTED=$(printf '%s\n' $ORDER | sort)
          if [ "$MEMBERS" != "$LISTED" ]; then
            echo "::error::publish list drift — every publishable workspace member must be in ORDER, in dependency order"
            diff <(echo "$LISTED") <(echo "$MEMBERS") | sed 's/^/  /' || true
            exit 1
          fi
          # And in dependency order: a crate listed before an infr crate it
          # needs fails to publish after the ones ahead of it are already up.
          # Dev-dependencies don't count; cargo strips path-only ones.
          MISORDERED=$(cargo metadata --no-deps --format-version 1 | jq -r --arg order "$ORDER" '
            ($order | split(" ")) as $o
            | .packages[] | select(.publish != []) | . as $p
            | ($o | index($p.name)) as $i
            | $p.dependencies[] | select(.path != null and .kind != "dev") | . as $d
            | select(($o | index($d.name)) >= $i)
            | "  \($p.name) is listed before \($d.name), which it needs"')
          if [ -n "$MISORDERED" ]; then
            echo "::error::ORDER is not in dependency order"
            echo "$MISORDERED"
            exit 1
          fi
          for CRATE in $ORDER; do
            publish_if_missing "$CRATE"
          done

  aur-bin:
    name: Publish AUR (infr-bin)
    needs: [publish-github-release]
    runs-on: ubuntu-26.04
    container: archlinux:latest
    steps:
      - name: Install deps
        run: pacman -Sy --noconfirm --needed base-devel git openssh curl
      - uses: actions/checkout@v7
      - name: Resolve version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Render PKGBUILD
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          BASE="https://github.com/kryptic-sh/infr/releases/download/v${VERSION}"
          SHA_X86=$(curl -sL "$BASE/infr-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          SHA_A64=$(curl -sL "$BASE/infr-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          test -n "$SHA_X86" && test -n "$SHA_A64"
          mkdir -p out
          sed -e "s/{VERSION}/${VERSION}/g" \
              -e "s/{SHA256_X86_64}/${SHA_X86}/g" \
              -e "s/{SHA256_AARCH64}/${SHA_A64}/g" \
              pkg/aur/PKGBUILD-bin.in > out/PKGBUILD
      - name: Generate .SRCINFO
        run: |
          useradd -m builder
          chown -R builder out
          su -s /bin/bash builder -c 'cd out && makepkg --printsrcinfo > .SRCINFO'
      - name: Push to AUR
        run: |
          # Assigned HERE, not in an `env:` block: a `~` inside an env value is
          # never expanded. git runs this via `sh -c`, tilde expansion does not
          # apply to the result of a parameter expansion, and ssh does not expand
          # `~` in a `-o` value either -- so the pin below would go unread and
          # StrictHostKeyChecking=yes would fail with "No ED25519 host key is
          # known". That is exactly how buffr's v0.14.7 AUR publish broke.
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          install -dm700 ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned host keys. Source: ssh-keyscan aur.archlinux.org.
          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS_EOF'
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          KNOWN_HOSTS_EOF
          chmod 600 ~/.ssh/known_hosts
          git config --global user.name  "infr-ci"
          git config --global user.email "ci@kryptic.sh"
          git clone ssh://aur@aur.archlinux.org/infr-bin.git aur-repo
          cp out/PKGBUILD out/.SRCINFO aur-repo/
          cp pkg/aur/LICENSE pkg/aur/.gitignore aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO LICENSE .gitignore
          if git diff --cached --quiet; then echo "nothing to push"; exit 0; fi
          git commit -m "infr-bin ${{ steps.tag.outputs.version }}-1"
          git push origin master

  brew-tap:
    name: Publish Homebrew formula
    needs: [publish-github-release]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Render formula
